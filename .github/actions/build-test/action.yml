name: Build and Test
description: Shared steps to build and test swift package
runs:
  using: "composite"
  steps:
    - name: Set up Swift
      uses: fwal/setup-swift@v2
      with:
        swift-version: "5.9"

    - name: Build Package
      run: swift build --build-tests
      shell: bash

    - name: Run Unit Tests
      run: swift test
      shell: bash
