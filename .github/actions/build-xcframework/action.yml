name: Build XCFramework
description: Builds and commits XCFramework if [release]
inputs:
  repository:
    description: "Full repo name (owner/repo)"
    required: true
  release:
    description: "Release flag from dispatch"
    required: false
  commit_message:
    description: "Commit message passed from push event"
    required: false
  PAT_TOKEN:
    description: "GitHub Personal Access Token"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🔍 Check if [release]
      id: check_release
      run: |
        if [[ "${{ inputs.release }}" == "true" ]]; then
          echo "release=true" >> $GITHUB_ENV
        elif [[ "${{ inputs.commit_message }}" == *"[release]"* ]]; then
          echo "release=true" >> $GITHUB_ENV
        else
          echo "release=false" >> $GITHUB_ENV
        fi
      shell: bash

    - name: 🛠️ Build XCFramework (only if [release])
      if: env.release == 'true'
      run: |
        chmod +x ./build-xcframework.sh
        ./build-xcframework.sh
      shell: bash

    - name: 📦 Commit and push (only if [release])
      if: env.release == 'true'
      run: |
        git remote set-url origin https://x-access-token:${{ inputs.PAT_TOKEN }}@github.com/${{ inputs.repository }}
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add -f build/SwiftyCollections.xcframework
        git commit -m "🔁 Auto-build XCFramework [release]" || echo "No changes"
        git push
      shell: bash

    - name: ℹ️ Skip Push (because not a [release] commit)
      if: env.release != 'true'
      run: |
        echo "ℹ️ No [release] in commit message. Skipping XCFramework build and push."
      shell: bash